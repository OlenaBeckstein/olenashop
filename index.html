<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neoric Neon</title>
    <link rel="stylesheet" href="styles/product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-bar">
        HEUTE VERSANDKOSTENFREI
    </div>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo-neoric_10c0843e-64e6-440c-93d1-9e96932fad90_360x.png" alt="NEORIC">
            </div>
            <nav>
                <ul>
                    <li><a href="#">Neon Armband™</a></li>
                    <li><a href="#">Größentabelle</a></li>
                    <li><a href="#">Versand</a></li>
                    <li><a href="#">Kontakt</a></li>
                </ul>
            </nav>
            <div class="cart">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-bag"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </div>
        </div>
    </header>

    <main>
        <div class="product-container">
            <div class="product-images">
                <div class="thumbnails">
                    <img class="thumbnail active" src="images/neoric_zitrone_hell_1298x.jpeg" alt="Thumbnail 1">
                    <img class="thumbnail" src="images/neoric_zitrone_dunkel_1298x.jpeg" alt="Thumbnail 2">
                    <img class="thumbnail" src="images/dsc02531_1412x.jpeg" alt="Thumbnail 3">
                    <img class="thumbnail" src="images/dsc02543_1412x.jpeg" alt="Thumbnail 4">
                </div>
                <div class="main-image-container">
                    <img id="main-image" src="images/neoric_zitrone_hell_1298x.jpeg" alt="Neoric Neon Apple Watch Armband">
                </div>
            </div>
            <div class="product-details">
                <h1>Neoric Neon</h1>
                <p class="subtitle">Apple Watch Armband</p>
                <div class="price">
                    <span class="new-price">19,99€</span>
                    <span class="old-price">24,99€</span>
                    <span class="tax">inkl. MwSt.</span>
                </div>
                <div class="availability">
                    <span class="dot"></span>
                    <span>Auf Lager, in 2-3 Tagen bei dir</span>
                </div>
                <button class="add-to-cart">In den Einkaufswagen</button>
            </div>
        </div>

        <section class="quality-section">
            <div class="quality-item">
                <img src="images/quality.svg" alt="100% Qualität">
                <h3>100% Qualität</h3>
                <p>Dank weichem Silikon</p>
            </div>
            <div class="quality-item">
                <img src="images/quality.svg" alt="100% Qualität">
                <h3>100% Qualität</h3>
                <p>Dank weichem Silikon</p>
            </div>
            <div class="quality-item">
                <img src="images/quality.svg" alt="100% Qualität">
                <h3>100% Qualität</h3>
                <p>Dank weichem Silikon</p>
            </div>
        </section>
    </main>

    <script src="scripts/product.js"></script>
</body>
</html>
